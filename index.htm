<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-RAM AI Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0c10; color: white; font-family: 'Inter', sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; padding: 1rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
        .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
        .btn { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 10px 20px; 
            border-radius: 8px; 
            backdrop-filter: blur(8px); 
            cursor: pointer; 
            pointer-events: auto;
            color: #ccc;
            font-weight: 500;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:hover { background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.3); color: #fff; }
        .btn:active { transform: scale(0.95); }
        .btn-cram { border-color: rgba(255, 60, 60, 0.4); color: #ff7777; background: rgba(255, 0, 0, 0.05); }
        .btn-cram:hover { background: rgba(255, 60, 60, 0.2); border-color: #ff5555; color: #fff; box-shadow: 0 0 15px rgba(255, 0, 0, 0.4); }
        .instructions { background: rgba(0, 0, 0, 0.6); padding: 10px 20px; border-radius: 8px; font-size: 0.85rem; color: #aaa; text-align: center; max-width: 600px; border: 1px solid rgba(255,255,255,0.05); }
        .highlight { color: #ff5555; font-weight: bold; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer">
        <div class="controls">
            <button class="btn" id="btn-ball">Spawn Ball</button>
            <button class="btn" id="btn-crate">Spawn Crate</button>
            <button class="btn btn-cram" id="btn-cram">Deploy C-RAM</button>
            <button class="btn" id="btn-clear">Clear Targets</button>
        </div>
        <div class="instructions">
            Drag and throw objects. C-RAM uses a <span class="highlight">Neural Network</span> to predict parabolic trajectories. 
            It learns from its misses by backpropagating the angular error at the closest approach point!
        </div>
    </div>

    <script>
        // --- CUSTOM NEURAL NETWORK (MLP) ---
        // A lightweight Multilayer Perceptron to learn intercept angles.
        class MLP {
            constructor(ni, nh, no, lr = 0.02) {
                this.ni = ni; this.nh = nh; this.no = no; this.lr = lr;
                // Initialize weights with small random values
                this.w1 = Array.from({length: ni * nh}, () => (Math.random() - 0.5) * 0.5);
                this.b1 = Array.from({length: nh}, () => (Math.random() - 0.5) * 0.5);
                this.w2 = Array.from({length: nh * no}, () => (Math.random() - 0.5) * 0.5);
                this.b2 = Array.from({length: no}, () => (Math.random() - 0.5) * 0.5);
            }

            forward(inp) {
                this.inp = inp;
                this.h = new Array(this.nh);
                for(let i = 0; i < this.nh; i++) {
                    let sum = this.b1[i];
                    for(let j = 0; j < this.ni; j++) {
                        sum += inp[j] * this.w1[i * this.ni + j];
                    }
                    this.h[i] = Math.tanh(sum); // Tanh activation for hidden layer
                }
                this.out = new Array(this.no);
                for(let i = 0; i < this.no; i++) {
                    let sum = this.b2[i];
                    for(let j = 0; j < this.nh; j++) {
                        sum += this.h[j] * this.w2[i * this.nh + j];
                    }
                    this.out[i] = sum; // Linear output
                }
                return this.out;
            }

            train(target) {
                // Calculate output error (MSE derivative)
                let dOut = new Array(this.no);
                for(let i = 0; i < this.no; i++) {
                    dOut[i] = target[i] - this.out[i];
                }

                // Backpropagate to hidden layer
                let dH = new Array(this.nh).fill(0);
                for(let i = 0; i < this.no; i++) {
                    for(let j = 0; j < this.nh; j++) {
                        dH[j] += dOut[i] * this.w2[i * this.nh + j];
                        // Update w2
                        this.w2[i * this.nh + j] += this.lr * dOut[i] * this.h[j];
                    }
                    // Update b2
                    this.b2[i] += this.lr * dOut[i];
                }

                // Backpropagate to input layer
                for(let i = 0; i < this.nh; i++) {
                    let d = dH[i] * (1 - this.h[i] * this.h[i]); // Derivative of tanh
                    for(let j = 0; j < this.ni; j++) {
                        // Update w1
                        this.w1[i * this.ni + j] += this.lr * d * this.inp[j];
                    }
                    // Update b1
                    this.b1[i] += this.lr * d;
                }
            }
        }

        // --- GAME ENGINE & PHYSICS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, floorY;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            floorY = height - 100;
        }
        window.addEventListener('resize', resize);
        resize();

        const GRAVITY = 0.25;
        const DRAG = 0.99;
        
        let targets = [];
        let crams = [];
        let bullets = [];
        let particles = [];

        // Interaction state
        let pointer = { x: 0, y: 0, vx: 0, vy: 0, isDown: false };
        let lastPointer = { x: 0, y: 0 };
        let draggedObj = null;

        // --- ENTITIES ---

        class Target {
            constructor(type, x, y) {
                this.type = type;
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = 0;
                this.r = type === 'ball' ? 20 : 25; // radius / half-size
                this.restitution = type === 'ball' ? 0.7 : 0.3;
                this.color = type === 'ball' ? '#4facf7' : '#e6a14c';
                this.dead = false;
                this.hits = 0;
            }

            update() {
                if (draggedObj === this) {
                    this.x = pointer.x;
                    this.y = pointer.y;
                    this.vx = pointer.x - lastPointer.x;
                    this.vy = pointer.y - lastPointer.y;
                    return;
                }

                this.vy += GRAVITY;
                this.vx *= DRAG;
                this.vy *= DRAG;

                this.x += this.vx;
                this.y += this.vy;

                // Floor collision
                if (this.y + this.r > floorY) {
                    this.y = floorY - this.r;
                    this.vy *= -this.restitution;
                    this.vx *= 0.95; // Ground friction
                }
                
                // Wall collisions
                if (this.x - this.r < 0) { this.x = this.r; this.vx *= -this.restitution; }
                if (this.x + this.r > width) { this.x = width - this.r; this.vx *= -this.restitution; }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                
                if (this.type === 'ball') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    ctx.rotate(this.vx * 0.05); // Spin based on velocity
                    ctx.beginPath();
                    ctx.rect(-this.r, -this.r, this.r * 2, this.r * 2);
                    ctx.fill();
                    ctx.stroke();
                    // Crate details
                    ctx.beginPath();
                    ctx.moveTo(-this.r, -this.r); ctx.lineTo(this.r, this.r);
                    ctx.moveTo(this.r, -this.r); ctx.lineTo(-this.r, this.r);
                    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        class CRAM {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vy = 0;
                // Neural Net: 4 inputs (dx, dy, tvx, tvy), 8 hidden, 1 output (angle_offset)
                this.nn = new MLP(4, 8, 1);
                this.cooldown = 0;
                this.target = null;
                this.aimAngle = -Math.PI / 2;
                
                // Stats
                this.shotsFired = 0;
                this.shotsHit = 0;
                this.trainCount = 0;
                this.accuracy = 0;
            }

            update() {
                // Drop to floor
                if (this.y < floorY) {
                    this.vy += GRAVITY;
                    this.y += this.vy;
                    if (this.y > floorY) { this.y = floorY; this.vy = 0; }
                }

                if (this.cooldown > 0) this.cooldown--;

                // Find valid target (in air)
                let bestTarget = null;
                let minDist = Infinity;
                for (let t of targets) {
                    if (t.y > floorY - t.r - 10) continue; // Ignore grounded targets
                    if (draggedObj === t) continue; // Ignore currently dragged targets
                    let d = Math.hypot(t.x - this.x, t.y - this.y);
                    if (d < minDist && d < 1200) { // Range limit
                        minDist = d;
                        bestTarget = t;
                    }
                }
                this.target = bestTarget;

                if (this.target) {
                    // Neural Network Prediction
                    let dx = this.target.x - this.x;
                    let dy = this.target.y - this.y;
                    
                    // Normalize inputs for NN (crucial for stability)
                    let inputs = [
                        dx / 1000, 
                        dy / 1000, 
                        this.target.vx / 20, 
                        this.target.vy / 20
                    ];
                    
                    let nnOutput = this.nn.forward(inputs);
                    let offsetAngle = nnOutput[0]; // Radians
                    
                    // Clip offset to prevent crazy spinning early on
                    offsetAngle = Math.max(-1.5, Math.min(1.5, offsetAngle));

                    let baseAngle = Math.atan2(dy, dx);
                    let targetAimAngle = baseAngle + offsetAngle;
                    
                    // Smoothly rotate barrel
                    let angleDiff = targetAimAngle - this.aimAngle;
                    // Normalize diff
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    
                    this.aimAngle += angleDiff * 0.5;

                    // Fire
                    if (this.cooldown <= 0 && Math.abs(angleDiff) < 0.2) {
                        this.fire(inputs, offsetAngle, baseAngle);
                    }
                } else {
                    // Return to rest position
                    let angleDiff = -Math.PI / 2 - this.aimAngle;
                    this.aimAngle += angleDiff * 0.1;
                }
            }

            fire(inputs, predictedOffset, baseAngle) {
                this.cooldown = 4; // Rapid fire
                this.shotsFired++;
                
                let bSpeed = 25;
                let bx = Math.cos(this.aimAngle) * bSpeed;
                let by = Math.sin(this.aimAngle) * bSpeed;

                // Barrel tip position
                let tipX = this.x + Math.cos(this.aimAngle) * 30;
                let tipY = this.y - 15 + Math.sin(this.aimAngle) * 30; // -15 is turret center offset

                bullets.push({
                    x: tipX, y: tipY,
                    vx: bx, vy: by,
                    parent: this,
                    target: this.target,
                    inputs: inputs,
                    predictedOffset: predictedOffset,
                    baseAngle: baseAngle,
                    active: true,
                    minDist: Infinity,
                    evaluated: false
                });

                // Muzzle flash particles
                for(let i=0; i<3; i++) {
                    particles.push(new Particle(tipX, tipY, bx*0.2 + (Math.random()-0.5)*2, by*0.2 + (Math.random()-0.5)*2, '#ffaa00'));
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Base
                ctx.fillStyle = '#222';
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-30, 0); ctx.lineTo(-20, -15); ctx.lineTo(20, -15); ctx.lineTo(30, 0);
                ctx.closePath();
                ctx.fill(); ctx.stroke();
                
                // Turret / Barrel
                ctx.translate(0, -15);
                ctx.rotate(this.aimAngle);
                
                // Barrel
                ctx.fillStyle = '#111';
                ctx.fillRect(10, -4, 30, 8);
                
                // Dome
                ctx.fillStyle = '#ddd';
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.restore();

                // UI Stats
                ctx.save();
                ctx.translate(this.x, this.y - 45);
                ctx.textAlign = 'center';
                ctx.font = '10px Inter';
                
                let acc = this.shotsFired > 0 ? ((this.shotsHit / this.shotsFired) * 100).toFixed(1) : "0.0";
                
                // Hit rate
                ctx.fillStyle = '#00ffaa';
                ctx.fillText(`HIT: ${acc}%`, 0, 0);
                
                // Gen / Training count
                ctx.fillStyle = '#ffaa00';
                ctx.fillText(`GEN: ${this.trainCount}`, 0, 12);
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, vx, vy, color) {
                this.x = x; this.y = y;
                this.vx = vx; this.vy = vy;
                this.color = color;
                this.life = 1.0;
                this.decay = Math.random() * 0.05 + 0.02;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // --- MAIN LOOP ---

        function update() {
            // Update pointers
            if (pointer.isDown && draggedObj) {
                pointer.vx = pointer.x - lastPointer.x;
                pointer.vy = pointer.y - lastPointer.y;
            }
            lastPointer.x = pointer.x;
            lastPointer.y = pointer.y;

            // Update Entities
            targets.forEach(t => t.update());
            crams.forEach(c => c.update());
            particles.forEach(p => p.update());
            particles = particles.filter(p => p.life > 0);

            // Update Bullets & Neural Network Training
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                if (!b.active) continue;

                b.x += b.vx;
                b.y += b.vy;

                let t = b.target;
                if (!t || t.dead) {
                    b.active = false; 
                    continue;
                }

                let dist = Math.hypot(b.x - t.x, b.y - t.y);

                // Collision Detection
                if (dist < t.r + 2) {
                    // HIT!
                    b.parent.shotsHit++;
                    b.parent.trainCount++;
                    b.active = false;
                    
                    // Train NN to enforce this good action (Loss = 0)
                    b.parent.nn.train([b.predictedOffset]);
                    
                    // Physical impact
                    t.vx += b.vx * 0.1;
                    t.vy += b.vy * 0.1;
                    
                    t.hits++;
                    if (t.hits >= 5) {
                        t.dead = true;
                        // Massive explosion
                        for(let p = 0; p < 30; p++) {
                            particles.push(new Particle(t.x, t.y, (Math.random()-0.5)*15, (Math.random()-0.5)*15, t.color));
                            particles.push(new Particle(t.x, t.y, (Math.random()-0.5)*10, (Math.random()-0.5)*10, '#ffffff'));
                            particles.push(new Particle(t.x, t.y, (Math.random()-0.5)*8, (Math.random()-0.5)*8, '#ff5555'));
                        }
                    } else {
                        // Small sparkles for normal hits
                        for(let p = 0; p < 5; p++) particles.push(new Particle(b.x, b.y, (Math.random()-0.5)*5, (Math.random()-0.5)*5, '#ff5555'));
                    }
                    continue;
                }

                // AI Training Evaluation (The magic happens here)
                if (!b.evaluated) {
                    if (dist < b.minDist) {
                        b.minDist = dist;
                        // Record target position at closest approach
                        b.closestTx = t.x;
                        b.closestTy = t.y;
                    } else if (dist > b.minDist + 1) {
                        // Distance is increasing -> Bullet has passed the target! (Closest approach reached)
                        b.evaluated = true;
                        
                        // Calculate the ideal angle that WOULD have hit the target at that moment
                        let idealAngle = Math.atan2(b.closestTy - b.parent.y, b.closestTx - b.parent.x);
                        
                        // Calculate ideal offset relative to original base angle
                        let idealOffset = idealAngle - b.baseAngle;
                        
                        // Normalize angle diff to -PI to PI
                        while (idealOffset > Math.PI) idealOffset -= Math.PI * 2;
                        while (idealOffset < -Math.PI) idealOffset += Math.PI * 2;

                        // TRAIN THE NETWORK!
                        b.parent.nn.train([idealOffset]);
                        b.parent.trainCount++;
                    }
                }

                // Remove offscreen
                if (b.x < 0 || b.x > width || b.y < 0 || b.y > height) {
                    b.active = false;
                }
            }
            
            // Clean up dead objects
            bullets = bullets.filter(b => b.active);
            targets = targets.filter(t => {
                if (t.dead && draggedObj === t) {
                    draggedObj = null;
                    pointer.isDown = false;
                }
                return !t.dead;
            });
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Draw Background Gradients / Atmosphere
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#0b0c10');
            grad.addColorStop(1, '#1f2833');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Draw Floor
            ctx.fillStyle = '#111';
            ctx.fillRect(0, floorY, width, height - floorY);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(width, floorY); ctx.stroke();

            // Draw Targets & CRAMs
            targets.forEach(t => t.draw(ctx));
            crams.forEach(c => c.draw(ctx));

            // Draw Neon Bullets (Red Tracers)
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff0000";
            ctx.strokeStyle = "#ff4444";
            ctx.lineCap = "round";
            ctx.lineWidth = 3;
            
            ctx.beginPath();
            for (let b of bullets) {
                ctx.moveTo(b.x, b.y);
                // Draw tracer tail based on velocity
                ctx.lineTo(b.x - b.vx * 0.8, b.y - b.vy * 0.8);
            }
            ctx.stroke();
            ctx.restore();

            // Draw Particles
            particles.forEach(p => p.draw(ctx));

            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            update();
            draw();
        }

        // --- INPUT HANDLING ---

        function getMousePos(e) {
            if(e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        function pointerDown(e) {
            let pos = getMousePos(e);
            pointer.x = pos.x; pointer.y = pos.y;
            pointer.isDown = true;
            
            // Check for drag
            for (let t of targets) {
                if (Math.hypot(t.x - pointer.x, t.y - pointer.y) < t.r * 1.5) {
                    draggedObj = t;
                    t.vx = 0; t.vy = 0;
                    break;
                }
            }
        }

        function pointerMove(e) {
            let pos = getMousePos(e);
            pointer.x = pos.x; pointer.y = pos.y;
        }

        function pointerUp(e) {
            pointer.isDown = false;
            if (draggedObj) {
                // Apply final velocity from throw
                draggedObj.vx = pointer.vx;
                draggedObj.vy = pointer.vy;
                draggedObj = null;
            }
        }

        canvas.addEventListener('mousedown', pointerDown);
        canvas.addEventListener('mousemove', pointerMove);
        window.addEventListener('mouseup', pointerUp);
        
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); pointerDown(e); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); pointerMove(e); }, {passive: false});
        window.addEventListener('touchend', pointerUp);

        // --- UI BINDINGS ---
        
        document.getElementById('btn-ball').addEventListener('click', () => {
            targets.push(new Target('ball', width/2 + (Math.random()-0.5)*100, 100));
        });
        
        document.getElementById('btn-crate').addEventListener('click', () => {
            targets.push(new Target('crate', width/2 + (Math.random()-0.5)*100, 100));
        });

        document.getElementById('btn-cram').addEventListener('click', () => {
            if (crams.length < 5) {
                crams.push(new CRAM(width/2 + (Math.random()-0.5)*400, -50));
            }
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            targets = [];
            bullets = [];
        });

        // Initialize setup
        crams.push(new CRAM(width/2, floorY));
        targets.push(new Target('ball', width/2 - 200, 200));

        // Start loop
        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
